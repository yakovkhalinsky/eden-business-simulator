[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eden-business-simulator"
version = "0.1.0"
description = "Greenfields business simulator framework for external tool evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Yakov Khalinsky" },
]
keywords = ["simulator", "business", "events", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "faker>=25.0",
    "structlog>=24.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
eden-business-simulator = "eden_business_simulator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eden_business_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

